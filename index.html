<script id="sr">
// 봉별 지지·저항. btc_levels.py 와 같은 규칙이고, 같은 값을 내는지 check_sr_js.py 로 확인한다.
const SR = (() => {
  //            N, 왼쪽엄격, 오른쪽엄격, 동시허용, 폭 ATR배, 폭 하한(가격비), 돌파 ATR배, 돌파 하한, 만료봉, 폭 상한(가격비. 이때 돌파 여유는 2%까지)
  const TF = { "1년": [1, 1, 1, 1, .25, 0, .10, 0, 0, .05], "6개월": [1, 1, 1, 1, .25, 0, .10, 0, 0, .05],
    "3개월": [1, 1, 1, 1, .25, 0, .10, 0, 0, .05], "1개월": [2, 1, 1, 1, .25, 0, .10, 0, 0, .05],
    "4시간": [3, 1, 0, 0, .25, .001, .10, .0005, 360, 0], "1시간": [2, 1, 1, 1, .25, 0, .10, 0, 336, 0],
    "30분": [2, 1, 0, 0, .20, .0003, .10, .0002, 336, 0], "5분": [2, 1, 1, 1, .25, .0002, .10, .0001, 576, 0] };
  const KEY = { "3개월": d => d.getUTCFullYear() * 10 + Math.floor(d.getUTCMonth() / 3),
    "6개월": d => d.getUTCFullYear() * 10 + Math.floor(d.getUTCMonth() / 6), "1년": d => d.getUTCFullYear() };
  const SHOW = 3;                                              // 현재가 위·아래로 가까운 구간 3개씩

  // 월봉을 분기·반기·연으로 묶는다 (마지막 묶음은 진행 중)
  function group(mo, key) {
    const out = [];
    for (const x of mo) {
      const k = key(new Date(x.t)), g = out[out.length - 1];
      if (g && g.k === k) { g.h = Math.max(g.h, x.h); g.l = Math.min(g.l, x.l); g.c = x.c; g.q += x.q || 0; }
      else out.push({ k, t: x.t, o: x.o, h: x.h, l: x.l, c: x.c, q: x.q || 0 });   // q = 거래대금(USDT)
    }
    return out;
  }

  // Wilder ATR14 (봉 20개 이상), 아니면 그때까지 실제 범위의 평균
  function atr(b) {
    const n = b.length, A = new Array(n).fill(NaN);
    let s = 0;
    for (let i = 0; i < n; i++) {
      const x = b[i], tr = i ? Math.max(x.h - x.l, Math.abs(x.h - b[i - 1].c), Math.abs(x.l - b[i - 1].c)) : x.h - x.l;
      if (n < 20) { s += tr; A[i] = s / (i + 1); }
      else if (i < 14) { s += tr; if (i === 13) A[i] = s / 14; }
      else A[i] = (A[i - 1] * 13 + tr) / 14;
    }
    return A;
  }

  // 좌우 N봉 스윙 피벗 → [봉 번호, 역할(-1 고점=저항, +1 저점=지지)], 고점 먼저
  function pivots(b, N, ls, rs, both) {
    const H = [], L = [];
    for (let i = N; i < b.length - N; i++) {
      let hi = true, lo = true;
      for (let k = 1; k <= N; k++) {
        hi = hi && (ls ? b[i].h > b[i - k].h : b[i].h >= b[i - k].h) && (rs ? b[i].h > b[i + k].h : b[i].h >= b[i + k].h);
        lo = lo && (ls ? b[i].l < b[i - k].l : b[i].l <= b[i - k].l) && (rs ? b[i].l < b[i + k].l : b[i].l <= b[i + k].l);
      }
      if (!both && hi && lo) hi = lo = false;
      if (hi) H.push([i, -1]);
      if (lo) L.push([i, 1]);
    }
    return H.concat(L);
  }

  // 완료 봉 b에서 시간 순서대로 구간을 만들고 갱신 → 살아 있는 구간 (1개월 이상은 직전 봉 고가·저가도)
  // 구간 = 피벗 ± 폭, 종가 2개 연속 밖이면 첫 번째는 역할 전환, 두 번째는 무효. 1시간 336봉·4시간 360봉 지나면 만료
  function zones(b, tf) {
    const [N, ls, rs, both, KW, PW, KB, PB, life, cap] = TF[tf], A = atr(b), n = b.length, born = {}, Z = [];
    for (const [i, r] of pivots(b, N, ls, rs, both)) (born[i + N] ??= []).push([i, r]);
    for (let t = 0; t < n; t++) {
      const c = b[t].c;
      for (const z of Z) {
        if (!z.alive || t <= z.conf) continue;
        if (life && t - z.s > life) { z.alive = false; continue; }
        z.run = (z.role < 0 ? c > z.U + z.m : c < z.D - z.m) ? z.run + 1 : 0;
        if (z.run >= 2) {
          if (z.flips) z.alive = false;
          else { z.role = -z.role; z.flips = 1; z.run = 0; }
        }
      }
      for (const [s, r] of born[t] || []) {
        const p = r > 0 ? b[s].l : b[s].h;
        if (!Number.isFinite(A[t])) continue;
        let w = Math.max(KW * A[t], PW * p), m = KB * A[t] + PB * p;
        if (cap) { w = Math.min(w, cap * p); m = Math.min(m, .02 * p); }
        let near = null;                                       // 가까운 피벗은 기존 구간에 합친다 (접촉 수만 +1)
        for (const z of Z) {
          const d = Math.abs(p - z.P);
          if (z.alive && d <= Math.min(w, z.w) && (!near || d < Math.abs(p - near.P) || (d === Math.abs(p - near.P) && z.s < near.s))) near = z;
        }
        if (near) { near.touch++; continue; }
        Z.push({ P: p, w, D: p - w, U: p + w, m, role: r, s, conf: t, run: 0, flips: 0, alive: true, touch: 1 });
      }
    }
    const out = Z.filter(z => z.alive);
    if (!life && n) {
      const x = b[n - 1];
      for (const [p, r] of [[x.h, -1], [x.l, 1]]) {
        const w = Math.min(KW * A[n - 1], cap * p);
        if (!out.some(z => Math.abs(p - z.P) <= Math.min(w, z.w))) out.push({ P: p, w, D: p - w, U: p + w, role: r, touch: 1 });
      }
    }
    return out;
  }

  // 같은 쪽에서 겹치는 구간은 한 띠로 합친다
  function union(zs) {
    const out = [];
    for (const z of [...zs].sort((a, b) => a.D - b.D)) {
      const g = out[out.length - 1];
      if (g && z.D <= g.U) { g.D = Math.min(g.D, z.D); g.U = Math.max(g.U, z.U); g.P = (g.D + g.U) / 2; g.parts.push(z); }
      else out.push({ ...z, parts: [z] });
    }
    return out;
  }

  function pick(Z, px) {
    return { sup: union(Z.filter(z => z.U < px)).sort((a, b) => (px - a.P) - (px - b.P)).slice(0, SHOW),
      res: union(Z.filter(z => z.D > px)).sort((a, b) => (a.P - px) - (b.P - px)).slice(0, SHOW),
      inside: union(Z.filter(z => z.D <= px && px <= z.U)) };
  }

  // 입력: 월봉·4시간·1시간(·30분·5분) (각각 마지막이 진행 중 봉) → 봉별 살아 있는 구간
  function compute(mo, h4, h1, m30, m5) {
    const all = { "1년": group(mo, KEY["1년"]), "6개월": group(mo, KEY["6개월"]), "3개월": group(mo, KEY["3개월"]), "1개월": mo, "4시간": h4, "1시간": h1 };
    if (m30) all["30분"] = m30;
    if (m5) all["5분"] = m5;
    return Object.fromEntries(Object.entries(all).map(([tf, b]) => [tf, zones(b.slice(0, -1), tf)]));
  }

  return { KEY, group, compute, pick, atr };
})();

// 추세 상태 = combo_v2.trend_state 와 같은 규칙 (v3 봇 E3: 일봉 반 + 4시간 반, 롱만). 입력은 끝난 봉. st = 봉마다 상태 (1 상승, −1 하락, 0 중립)
const TR = (() => {
  // 4시간: 200EMA·ATR14·6봉 기울기. 켜짐 = 종가가 EMA±0.5ATR 밖 + 기울기 같은 방향, 유지 = 종가가 EMA∓0.5ATR 안 넘음 + 기울기 반대 아님
  function h4(b) {
    const n = b.length, A = SR.atr(b), E = [], st = [];
    let s = 0;
    for (let t = 0; t < n; t++) {
      const c = b[t].c;
      E[t] = t ? E[t - 1] + (c - E[t - 1]) * 2 / 201 : c;
      if (t < 200 || !Number.isFinite(A[t])) s = 0;
      else {
        const sl = (E[t] - E[t - 6]) / A[t], hi = E[t] + .5 * A[t], lo = E[t] - .5 * A[t];
        if (s === 1 && !(c > lo && sl >= 0)) s = 0;
        else if (s === -1 && !(c < hi && sl <= 0)) s = 0;
        if (s === 0) s = c > hi && sl > 0 ? 1 : c < lo && sl < 0 ? -1 : 0;
      }
      st[t] = s;
    }
    return { st, s, ema: E[n - 1], atr: A[n - 1], up: E[n - 1] > E[n - 7] };
  }
  // 일봉: 200일선 위 + 직전 55일 최고 종가 돌파면 켜짐, 직전 20일 최저 종가 아래나 200일선 아래로 마감하면 꺼짐 (하락은 대칭)
  // on·off = 다음 일봉 종가가 넘어야 바뀌는 가격. 200일선은 그 종가까지 넣어 계산하므로 "최근 199일 평균 위"와 같다
  function d1(b) {
    const c = b.map(x => x.c), n = c.length, st = [];
    const mean = (i, j) => { let s = 0; for (let k = i; k < j; k++) s += c[k]; return s / (j - i); };
    const hi = (t, k) => Math.max(...c.slice(t - k, t)), lo = (t, k) => Math.min(...c.slice(t - k, t));
    let s = 0;
    for (let t = 0; t < n; t++) {
      if (t < 200) s = 0;
      else {
        const m = mean(t - 199, t + 1), reg = c[t] > m ? 1 : c[t] < m ? -1 : 0;
        if (s === 1 && (c[t] < lo(t, 20) || reg < 0)) s = 0;
        else if (s === -1 && (c[t] > hi(t, 20) || reg > 0)) s = 0;
        if (s === 0) s = c[t] > hi(t, 55) && reg > 0 ? 1 : c[t] < lo(t, 55) && reg < 0 ? -1 : 0;
      }
      st[t] = s;
    }
    const m = mean(n - 199, n);
    return { st, s, on: Math.max(hi(n, 55), m), off: Math.max(lo(n, 20), m) };
  }
  return { h4, d1 };
})();
</script>

<script>
const $ = id => document.getElementById(id);
const ORDER = ["1년", "6개월", "3개월", "1개월", "4시간", "1시간", "30분", "5분"];   // 지지·저항을 계산하는 봉
const VIEW = ["1년", "6개월", "3개월", "1개월", "4시간", "1시간", "30분", "15분", "5분", "1분"];   // 차트로 볼 수 있는 봉 (15분·1분은 보기만)
// 선 색: 긴 봉은 어둡고 차가운 색, 1시간까지 따뜻한 색, 30분·5분은 짙은·옅은 회색. 캔들 초록·빨강을 피했다.
// 색끼리 일반 시력 색차(OKLab×100) 13 이상. 5분 회색만 흰 바탕 대비 2.5:1 이라 선 이름표로 구분한다
const SHADE = { "1년": "#000000", "6개월": "#1e3a8a", "3개월": "#8e24aa", "1개월": "#2a78d6", "4시간": "#8d5524", "1시간": "#c98500", "30분": "#4b5563", "5분": "#9ca3af" };
const DARK = new Set(["1시간", "5분"]);                                          // 밝은 선은 축 이름표 글씨를 검게
const IV = { "1년": "1M", "6개월": "1M", "3개월": "1M", "1개월": "1M", "4시간": "4h", "1시간": "1h", "30분": "30m", "15분": "15m", "5분": "5m", "1분": "1m" };
const API = "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&limit=1500&interval=";
const WS = "wss://fstream.binance.com/market/ws/btcusdt@kline_";   // USDⓈ-M 스트림은 /market/ws/ 아래 (옛 /ws/는 연결만 되고 안 옴)
const UP = "#089981", DN = "#F23645", TZ = -new Date().getTimezoneOffset() * 60;   // 봉 시간을 내 시간(KST)으로
const two = n => String(n).padStart(2, "0");
let tf = "4시간", D = null, Z = null, px = null, ws = null, lines = [], drawn = null, hide = new Set();
try { if (VIEW.includes(localStorage.srTf)) tf = localStorage.srTf; hide = new Set(JSON.parse(localStorage.srHide || "[]")); } catch {}

const chart = LightweightCharts.createChart($("chart"), {
  autoSize: true,
  layout: { background: { color: "#ffffff" }, textColor: "#131722", fontSize: 12,
    fontFamily: '-apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, "Apple SD Gothic Neo", sans-serif' },
  grid: { vertLines: { color: "#f0f3fa" }, horzLines: { color: "#f0f3fa" } },
  rightPriceScale: { borderVisible: false, scaleMargins: { top: .08, bottom: .08 } },
  timeScale: { borderVisible: false, rightOffset: 8 },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  localization: { locale: "ko-KR", timeFormatter: t => {
    const d = new Date(t * 1000), s = `${d.getUTCFullYear()}-${two(d.getUTCMonth() + 1)}`;
    return IV[tf] === "1M" ? s : `${s}-${two(d.getUTCDate())} ${two(d.getUTCHours())}:${two(d.getUTCMinutes())}`; } },
});
const series = chart.addSeries(LightweightCharts.CandlestickSeries, { upColor: UP, downColor: DN, borderVisible: false,
  wickUpColor: UP, wickDownColor: DN, priceFormat: { type: "custom", formatter: v => Math.round(v).toLocaleString("en-US"), minMove: 1 } });

const toBar = k => ({ t: +k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], q: +k[7] });   // q = 거래대금(USDT)
const toCandle = b => ({ time: b.t / 1000 + TZ, open: b.o, high: b.h, low: b.l, close: b.c });
const get = iv => fetch(API + iv + (iv === "1M" ? "&startTime=0" : ""))
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(a => a.map(toBar));
const bars = () => SR.KEY[tf] ? SR.group(D["1M"], SR.KEY[tf]) : D[IV[tf]];

// 아래 칸: 거래량(USDT). 오른 봉 초록·내린 봉 빨강, 평소(회색 선 = 직전 20봉 중앙값)의 1.5배 이상이면 진하게
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const vfmt = v => v >= 1e12 ? (v / 1e12).toFixed(1) + "T" : v >= 1e9 ? (v / 1e9).toFixed(1) + "B" : v >= 1e6 ? (v / 1e6).toFixed(0) + "M" : v >= 1e3 ? (v / 1e3).toFixed(0) + "K" : v.toFixed(0);
const vOpt = { priceFormat: { type: "custom", formatter: vfmt, minMove: 1 }, lastValueVisible: false, priceLineVisible: false };
const volS = chart.addSeries(LightweightCharts.HistogramSeries, vOpt, 1);
const normS = chart.addSeries(LightweightCharts.LineSeries, { ...vOpt, color: "#787b86", lineWidth: 1, crosshairMarkerVisible: false }, 1);
chart.panes()[1].setStretchFactor(.4);
const norm = (b, i) => median(b.slice(i - 20, i).map(x => x.q));
const vBar = (b, i) => { const x = b[i], a = i >= 20 && x.q >= 1.5 * norm(b, i) ? .9 : .3;
  return { time: x.t / 1000 + TZ, value: x.q, color: (x.c >= x.o ? "rgba(8,153,129," : "rgba(242,54,69,") + a + ")" }; };
const nPt = (b, i) => ({ time: b[i].t / 1000 + TZ, value: norm(b, i) });
function setAll() { const b = bars(); series.setData(b.map(toCandle)); volS.setData(b.map((_, i) => vBar(b, i)));
  normS.setData(b.flatMap((_, i) => i >= 20 ? [nPt(b, i)] : [])); }
function setLast() { const b = bars(), i = b.length - 1; series.update(toCandle(b[i])); volS.update(vBar(b, i)); if (i >= 20) normS.update(nPt(b, i)); }

// 켜 둔 봉의 선을 그린다. 여러 봉에 같은 가격이 있으면 선 하나(가장 긴 봉 색)에 이름을 모은다.
// 짧은 봉 선부터 그려서 긴 봉 선이 위에 온다
function draw() {
  if (!Z || px == null) return;
  const at = new Map();
  for (const t of ORDER) {
    if (hide.has(t)) continue;
    const p = SR.pick(Z[t], px);
    for (const z of [...p.res, ...p.inside, ...p.sup]) { const k = Math.round(z.P); at.set(k, [...new Set([...(at.get(k) || []), t])]); }
  }
  const sel = [...at].sort((a, b) => ORDER.indexOf(b[1][0]) - ORDER.indexOf(a[1][0]));
  const key = sel.join();
  if (key === drawn) return;
  drawn = key;
  lines.forEach(l => series.removePriceLine(l));
  lines = sel.map(([p, ts]) => series.createPriceLine({ price: p, color: SHADE[ts[0]], lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Solid,
    axisLabelVisible: true, title: ts.join("·"), axisLabelColor: SHADE[ts[0]], axisLabelTextColor: DARK.has(ts[0]) ? "#131722" : "#ffffff" }));
}

function setPrice(p) {
  $("price").style.color = px == null || p >= px ? UP : DN;
  px = p;
  $("price").textContent = p.toLocaleString("en-US", { maximumFractionDigits: 0 });
  draw();
}

function connect() {
  if (ws) { ws.onclose = ws.onmessage = null; ws.close(); }
  ws = new WebSocket(WS + IV[tf]);
  ws.onopen = () => $("dot").style.background = UP;
  ws.onclose = () => { $("dot").style.background = DN; setTimeout(connect, 3000); };
  ws.onmessage = e => {
    const k = JSON.parse(e.data).k, a = k && D && D[k.i];
    if (!a) return;
    const b = { t: k.t, o: +k.o, h: +k.h, l: +k.l, c: +k.c, q: +k.q };
    if (b.t === a.at(-1).t) a[a.length - 1] = b; else if (b.t > a.at(-1).t) a.push(b);
    if (k.i === IV[tf]) setLast();
    setPrice(b.c);
    $("upd").textContent = "실시간 " + new Date().toLocaleTimeString("ko-KR");
  };
}

// 긴 봉은 전체, 나머지는 최근 200봉. 탭이 가려진 채 열리면 차트 폭이 0이라 틀어지므로 폭이 생길 때 다시 맞춘다
let reframe = false;
function frame() {
  reframe = !chart.timeScale().width();
  const n = series.data().length;                              // fitContent 는 오른쪽 여백만큼 왼쪽 봉을 잘라서 직접 범위를 준다
  chart.timeScale().setVisibleLogicalRange(IV[tf] === "1M" ? { from: -1, to: n + 2 } : { from: n - 200, to: n + 8 });
}
chart.timeScale().subscribeSizeChange(() => { if (reframe) frame(); });

async function show() {
  const want = tf, iv = IV[tf];
  document.querySelectorAll("#tfs button").forEach(b => b.classList.toggle("on", b.textContent === tf));
  if (/m$/.test(iv)) {                                         // 분봉은 고를 때마다 새로 받는다 (30분·5분 선은 refresh 값으로 계산)
    try { D[iv] = await get(iv); } catch (e) { $("upd").textContent = "데이터 오류: " + e.message; return; }
    if (want !== tf) return;                                   // 받는 사이 다른 봉을 골랐으면 버린다
  }
  chart.applyOptions({ timeScale: { timeVisible: iv !== "1M" } });
  setAll();
  frame();
  connect();
}

// 맨 아래 줄: v3 봇과 같은 추세 규칙(일봉·4시간, 롱만)의 지금 상태와, 다음 종가가 어디를 넘어야 바뀌는지
const won = v => Math.round(v).toLocaleString("en-US");
function renderTrend() {
  const d = TR.d1(D["1d"].slice(0, -1)), h = TR.h4(D["4h"].slice(0, -1)), on = (d.s > 0) + (h.s > 0);
  const tag = (name, s, how) => `<span><i style="background:${s > 0 ? UP : s < 0 ? DN : "#b2b5be"}"></i>${name} <b>${s > 0 ? "상승" : s < 0 ? "하락" : "중립"}</b> ${how}</span>`;
  $("trend").innerHTML = [`<span><b>추세</b></span>`,
    tag("일봉", d.s, d.s > 0 ? `· 종가 ${won(d.off)} 아래로 마감하면 꺼짐` : `· 종가 ${won(d.on)} 위로 마감하면 켜짐`),
    tag("4시간", h.s, h.s > 0 ? `· 종가 ≈${won(h.ema - .5 * h.atr)} 아래거나 200EMA가 꺾이면 꺼짐`
      : `· 종가 ≈${won(h.ema + .5 * h.atr)} 위 + 200EMA 오름세면 켜짐 (지금 ${h.up ? "오름" : "내림"}세)`),
    `<span>→ <b>${on === 2 ? "롱 (둘 다 켜짐)" : on ? `롱 절반 (${d.s > 0 ? "일봉" : "4시간"}만 켜짐)` : "쉼 (롱 신호 없음)"}</b></span>`,
    `<span class="key">아래 칸 = 거래량 <i style="background:${UP}"></i>오른 봉 <i style="background:${DN}"></i>내린 봉 · 진하면 평소(회색 선)의 1.5배 이상</span>`].join("");
}

// 시세를 새로 받아 봉별 구간·추세를 다시 계산. 5분마다 깨서, 그사이 봉이 닫힌 것만 받는다 (월봉은 매 정시)
const EVERY = { "1M": 3600e3, "1d": 86400e3, "4h": 14400e3, "1h": 3600e3, "30m": 1800e3, "5m": 300e3 }, got = {};
async function refresh() {
  let wait = 300e3 - Date.now() % 300e3 + 5e3;
  try {
    const now = Date.now(), need = Object.keys(EVERY).filter(iv => !got[iv] || Math.floor(now / EVERY[iv]) > Math.floor(got[iv] / EVERY[iv]));
    const res = await Promise.all(need.map(get)), first = !D;
    D = D || {}; need.forEach((iv, i) => { D[iv] = res[i]; got[iv] = now; });
    Z = SR.compute(D["1M"], D["4h"], D["1h"], D["30m"], D["5m"]); drawn = null; renderTrend();
    if (first) await show();
    else if (need.includes(IV[tf])) { const r = chart.timeScale().getVisibleLogicalRange(); setAll(); if (r) chart.timeScale().setVisibleLogicalRange(r); }
    if (px == null) setPrice(D["5m"].at(-1).c); else draw();
    $("upd").textContent = "갱신 " + new Date().toLocaleTimeString("ko-KR");
  } catch (e) { $("upd").textContent = "데이터 오류: " + e.message + " (30초 뒤 다시)"; wait = 30e3; }
  setTimeout(refresh, wait);
}

// ---- 그리기: 수평선·연장선 (트레이딩뷰 식). 시간+가격으로 저장해서 어느 봉으로 봐도 같은 자리에 그려지고, 이 브라우저에만 저장된다.
// 도구를 고르고 누른다. 수평선은 한 번, 연장선은 두 점 (두 번 누르거나, 누른 채 끌어서 놓기). 연장선 = 두 점을 지나 양쪽으로 끝없이 이어지는 선.
// 도구 없이 선을 누르면 선택돼서 끌면 옮겨지고 (연장선은 끝점을 끌면 모양이 바뀜), Delete 키나 삭제 버튼으로 지운다.
// 봉의 시가·고가·저가·종가가 10px 안이면 거기에 붙는다 (Alt 를 누르면 안 붙음). 라이브러리에 선 그리기가 없어서 시리즈 프리미티브로 직접 그린다.
const INK = "#d946ef";
let tool = "", shapes = [], pend = null, mouse = null, chosen = null, press = null, repaint = () => {};
try { shapes = JSON.parse(localStorage.srDraw || "[]").filter(s => s && (s.k === "h" ? Number.isFinite(s.p1) : s.k === "x" && [s.t1, s.p1, s.t2, s.p2].every(Number.isFinite))); } catch {}
const saveShapes = () => { try { localStorage.srDraw = JSON.stringify(shapes.map(({ pl, ...s }) => s)); } catch {} };
const mkLine = s => { s.pl = series.createPriceLine({ price: s.p1, color: INK, lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed,   // 수평선 = 가격선 (축 이름표가 같이 붙음)
  axisLabelVisible: true, title: "", axisLabelColor: INK, axisLabelTextColor: "#131722" }); };
shapes.forEach(s => { if (s.k === "h") mkLine(s); });

// 화면 ↔ 시간·가격. 시간은 실제 초(UTC)로 저장하고, 차트가 쓰는 시간(TZ만큼 민 값)으로 바꿔 쓴다
const stepSec = d => d.length > 1 ? d[d.length - 1].time - d[d.length - 2].time : 86400;
function xToTime(x, d) {                                       // 가장 가까운 봉 (차트 밖은 봉 간격만큼 연장)
  const l = chart.timeScale().coordinateToLogical(x), n = d.length;
  if (l === null || n < 2) return null;
  const i = Math.round(l);
  return i < 0 ? d[0].time + i * stepSec(d) : i > n - 1 ? d[n - 1].time + (i - (n - 1)) * stepSec(d) : d[i].time;
}
function timeToX(t, d) {
  const n = d.length, ts = chart.timeScale(); let l;
  if (n < 2) return null;
  if (t <= d[0].time) l = (t - d[0].time) / stepSec(d);
  else if (t >= d[n - 1].time) l = n - 1 + (t - d[n - 1].time) / stepSec(d);
  else { let a = 0, b = n - 1; while (b - a > 1) { const m = (a + b) >> 1; if (d[m].time <= t) a = m; else b = m; } l = a + (t - d[a].time) / (d[b].time - d[a].time); }
  const f = Math.floor(l), xa = ts.logicalToCoordinate(f), xb = ts.logicalToCoordinate(f + 1);   // 라이브러리는 소수 번호엔 0을 주므로 정수 번호 둘 사이를 직접 섞는다
  return xa === null || xb === null ? null : xa + (xb - xa) * (l - f);
}
function pointAt(x, y, e) {                                    // 화면 점 → {t, p}
  const d = series.data(), t = xToTime(x, d);
  let p = series.coordinateToPrice(y);
  if (t === null || p === null) return null;
  const b = d[Math.round(chart.timeScale().coordinateToLogical(x))];
  if (b && !(e && e.altKey)) {
    const [v, gap] = [b.open, b.high, b.low, b.close].map(v => [v, Math.abs(series.priceToCoordinate(v) - y)]).sort((u, w) => u[1] - w[1])[0];
    if (gap < 10) p = v;
  }
  return { t: t - TZ, p };
}
function segs() {                                              // 화면에 그릴 연장선 [{s, A, B}] (미리보기 포함). 좌표를 못 구한 것은 뺀다
  if (!shapes.length && !pend) return [];
  const d = series.data(), out = [];
  const xy = (t, p) => { const x = timeToX(t + TZ, d), y = series.priceToCoordinate(p); return x === null || y === null ? null : { x, y }; };
  for (const s of [...shapes, ...(pend && mouse ? [{ ...pend, t2: mouse.t, p2: mouse.p, tmp: 1 }] : [])]) {
    if (s.k !== "x") continue;
    const A = xy(s.t1, s.p1), B = xy(s.t2, s.p2);
    if (A && B) out.push({ s, A, B });
  }
  return out;
}
series.attachPrimitive({
  attached: p => { repaint = p.requestUpdate; },
  paneViews: () => [{ zOrder: () => "top", renderer: () => ({ draw: tgt => tgt.useMediaCoordinateSpace(({ context: c, mediaSize: { width: W, height: H } }) => {
    for (const { s, A, B } of segs()) {
      c.strokeStyle = INK; c.lineWidth = s === chosen ? 3 : 2; c.setLineDash([6, 4]); c.globalAlpha = s.tmp ? .55 : 1;   // 수평선과 같은 점선, 둘째 점 전 미리보기는 옅게
      c.beginPath();
      if (Math.abs(B.x - A.x) < .5) { c.moveTo(A.x, 0); c.lineTo(A.x, H); }            // 두 점이 위아래로 겹치면 세로선
      else { const m = (B.y - A.y) / (B.x - A.x); c.moveTo(0, A.y - m * A.x); c.lineTo(W, A.y + m * (W - A.x)); }
      c.stroke();
      if (s === chosen) for (const q of [A, B]) { c.setLineDash([]); c.beginPath(); c.arc(q.x, q.y, 5, 0, 7); c.fillStyle = "#fff"; c.fill(); c.lineWidth = 1.5; c.stroke(); }
    }
  }) }) }],
});
function hitShape(x, y, tol = 6) {                            // 점 아래의 그림 (나중에 그린 것 먼저). 선택된 연장선의 끝점이면 w = "A"|"B". tol = 허용 픽셀 (손가락은 넓게)
  const G = segs();
  for (const s of [...shapes].reverse()) {
    if (s.k === "h") { const yy = series.priceToCoordinate(s.p1); if (yy !== null && Math.abs(y - yy) < tol) return { s }; continue; }
    const g = G.find(g => g.s === s); if (!g) continue;
    if (s === chosen) for (const w of ["A", "B"]) if (Math.hypot(g[w].x - x, g[w].y - y) < tol + 3) return { s, w };
    const dx = g.B.x - g.A.x, dy = g.B.y - g.A.y, L = Math.hypot(dx, dy);
    if (L && Math.abs(dx * (g.A.y - y) - (g.A.x - x) * dy) / L < tol) return { s };            // 두 점을 지나는 직선까지의 거리
  }
  return null;
}
function shiftShape(s, o, dx, dy) {                            // 픽셀만큼 옮긴다 (그려진 모습 그대로 따라가게)
  const d = series.data();
  for (const [kt, kp] of [["t1", "p1"], ["t2", "p2"]]) {
    if (o[kt] !== undefined) { const x = timeToX(o[kt] + TZ, d), t = x === null ? null : xToTime(x + dx, d); if (t !== null) s[kt] = t - TZ; }
    if (o[kp] !== undefined) { const y = series.priceToCoordinate(o[kp]), p = y === null ? null : series.coordinateToPrice(y + dy); if (p !== null) s[kp] = p; }
  }
}

function syncTools() {
  $("tools").querySelectorAll("button[data-k]").forEach(b => b.classList.toggle("on", b.dataset.k === tool));
  $("del").disabled = !chosen;
  $("hint").textContent = tool === "h" ? "놓을 곳을 누르세요"                                // 취소 = Esc 또는 도구 버튼 다시 누르기
    : tool === "x" ? (pend ? "둘째 점을 누르세요" : "첫째 점을 누르세요")
    : chosen ? "끌어서 옮기기 · Delete 삭제" : "";
  for (const s of shapes) if (s.pl) s.pl.applyOptions({ price: s.p1, lineWidth: s === chosen ? 3 : 2 });
  repaint();
}
const setTool = k => { tool = k; pend = null; if (k) chosen = null; syncTools(); };
function addShape(s) { shapes.push(s); if (s.k === "h") mkLine(s); chosen = s; tool = ""; pend = null; saveShapes(); syncTools(); }
function removeChosen() {
  if (!chosen) return;
  if (chosen.pl) series.removePriceLine(chosen.pl);
  shapes.splice(shapes.indexOf(chosen), 1); chosen = null; saveShapes(); syncTools();
}
$("tools").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.k) setTool(tool === b.dataset.k ? "" : b.dataset.k);
  else if (b.id === "del") removeChosen();
  else if (b.id === "clr" && shapes.length && confirm("그린 선을 모두 지울까요?")) {
    shapes.forEach(s => { if (s.pl) series.removePriceLine(s.pl); }); shapes = []; chosen = null; saveShapes(); setTool("");
  }
};
window.addEventListener("keydown", e => {
  if (e.key === "Escape") { chosen = null; setTool(""); }
  else if ((e.key === "Delete" || e.key === "Backspace") && chosen) removeChosen();
});

// 마우스: 누르면 도구가 있을 땐 그리기, 없을 땐 선 선택·옮기기, 아무것도 없으면 차트 끌기. 그리거나 옮기는 동안은 차트가 같이 안 끌리게 끈다
// (차트 라이브러리가 누름을 보기 전에 캡처 단계에서 꺼야 한다)
const rel = e => { const r = $("chart").getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
const inPane = (x, y) => x >= 0 && x < chart.timeScale().width() && y >= 0 && y < chart.panes()[0].getHeight();
const lockPan = on => chart.applyOptions({ handleScroll: { pressedMouseMove: !on, horzTouchDrag: !on, vertTouchDrag: !on } });
$("chart").addEventListener("pointerdown", e => {
  if (e.button !== 0 || !series.data().length) return;
  const [x, y] = rel(e);
  if (!inPane(x, y)) return;
  press = { x, y, mode: "pan" };
  if (tool) {
    press.mode = "draw";
    if (tool === "x" && !pend) { const p = pointAt(x, y, e); if (p) { pend = { k: "x", t1: p.t, p1: p.p }; press.fresh = true; } }
  } else {
    const h = hitShape(x, y, e.pointerType === "touch" ? 16 : 6);
    chosen = h ? h.s : null;
    if (h) Object.assign(press, { mode: h.w ? "anchor" : "move", w: h.w, orig: { ...h.s }, moved: false });
  }
  if (press.mode !== "pan") lockPan(true);
  syncTools();
}, true);
window.addEventListener("pointermove", e => {
  const [x, y] = rel(e), on = inPane(x, y);
  mouse = on && (pend || press) ? pointAt(x, y, e) : null;       // 미리보기·끌기에만 필요
  if (press && (press.mode === "move" || press.mode === "anchor") && (press.moved || Math.hypot(x - press.x, y - press.y) > 3)) {
    press.moved = true;
    if (press.mode === "move") shiftShape(chosen, press.orig, x - press.x, y - press.y);
    else if (mouse) { const n = press.w === "A" ? 1 : 2; chosen["t" + n] = mouse.t; chosen["p" + n] = mouse.p; }
    if (chosen.pl) chosen.pl.applyOptions({ price: chosen.p1 });
  }
  if (!press) { const h = on && !tool && shapes.length ? hitShape(x, y) : null; $("wrap").dataset.cur = !on ? "" : tool ? "crosshair" : h ? (h.w ? "move" : "pointer") : ""; }
  if (pend || press) repaint();
});
window.addEventListener("pointerup", e => {
  if (!press) return;
  const [x, y] = rel(e), moved = Math.hypot(x - press.x, y - press.y) > 5, m = press.mode, p = pointAt(x, y, e);
  if (m === "draw" && p) {
    if (tool === "h") addShape({ k: "h", p1: p.p });
    else if (tool === "x" && pend && (moved || !press.fresh) && (p.t !== pend.t1 || p.p !== pend.p1)) addShape({ ...pend, t2: p.t, p2: p.p });
  } else if (press.moved) saveShapes();
  if (m !== "pan") lockPan(false);
  press = null; syncTools();
}, true);
window.addEventListener("pointercancel", () => { if (press && press.mode !== "pan") lockPan(false); press = null; });
syncTools();

$("tfs").innerHTML = VIEW.map(t => `<button>${t}</button>`).join("");
$("tfs").onclick = e => {
  if (e.target.tagName !== "BUTTON" || !D) return;
  tf = e.target.textContent; try { localStorage.srTf = tf; } catch {}
  show();
};
$("legend").insertAdjacentHTML("afterbegin", ORDER.map(t => `<button data-t="${t}" style="--c:${SHADE[t]}">${t}</button>`).join(""));
const paint = () => $("legend").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(!hide.has(b.dataset.t))));
$("legend").onclick = e => {
  const t = e.target.closest("button")?.dataset.t;
  if (!t) return;
  hide.has(t) ? hide.delete(t) : hide.add(t);
  try { localStorage.srHide = JSON.stringify([...hide]); } catch {}
  paint(); drawn = null; draw();
};
paint();
refresh();

</script>
</body>
</html>

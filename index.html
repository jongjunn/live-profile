<!doctype html>
<html lang="ko">
<head>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#131722; --panel:#1b2030; --line:#2a3042; --text:#d1d4dc; --dim:#8a90a0; --up:#26a69a; --down:#ef5350; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px -apple-system, "Apple SD Gothic Neo", sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 7px; font:inherit; }
  label { color:var(--dim); font-size:12px; }
  #price { font-size:24px; font-weight:700; margin-left:auto; font-variant-numeric:tabular-nums; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--down); display:inline-block; margin-right:5px; }
  main { display:flex; flex:1; min-height:0; }
  body:not(.detail) aside { display:none; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 9px; font:inherit; cursor:pointer; }
  #ohlc { position:absolute; left:52px; top:8px; z-index:11; pointer-events:none; font-size:12px; background:rgba(19,23,34,.88);
          padding:3px 8px; border-radius:4px; font-variant-numeric:tabular-nums; }
  #tools { position:absolute; left:8px; top:8px; z-index:12; display:flex; flex-direction:column; gap:4px; }
  #tools button { width:34px; height:30px; padding:0; font-size:13px; background:rgba(27,32,48,.92); }
  #tools button.on { border-color:#4fc3f7; color:#4fc3f7; }
  #status { display:flex; flex-wrap:wrap; gap:6px; padding:6px 14px; border-bottom:1px solid var(--line); font-size:13px; }
  .chip { padding:4px 10px; border-radius:6px; background:var(--panel); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .chip .big { font-size:15px; font-weight:800; }
  #chartWrap { position:relative; flex:1; min-width:0; }
  #chart { position:absolute; inset:0; }
  #overlay { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:10; }
  aside { width:310px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--line); padding:14px; overflow:auto; line-height:1.5; }
  aside h3 { margin:0 0 5px; font-size:12px; color:var(--dim); font-weight:600; }
  aside section { margin-bottom:14px; }
  .ck-title { font-size:15px; font-weight:800; margin-bottom:10px; }
  .card { background:#161b28; border:1px solid var(--line); border-radius:8px; padding:10px 11px; margin-bottom:10px; }
  .ck-h { font-size:12px; color:var(--dim); font-weight:700; margin-bottom:6px; }
  .verdict { font-size:28px; font-weight:900; line-height:1.1; }
  .lrow { display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:13px; font-weight:600; }
  .dot { display:inline-block; width:13px; height:13px; border-radius:50%; margin-left:4px; }
  .dimrow { color:var(--dim); font-size:12px; margin-top:4px; }
  .kv { display:flex; justify-content:space-between; gap:8px; font-size:13.5px; margin-top:5px; font-variant-numeric:tabular-nums; }
  .kv small { font-weight:500; color:var(--dim); }
  .warn { margin-top:6px; font-size:12px; color:#ef5350; font-weight:700; }
  .inrow { font-size:12px; color:var(--dim); margin-bottom:4px; }
  .inrow input { width:62px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:5px; padding:3px 5px; font:inherit; }
  .v { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
  .dim { color:var(--dim); font-size:12px; }
  .zl { display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px; padding:5px 7px; border-radius:6px; margin-bottom:4px; font-variant-numeric:tabular-nums; font-size:12.5px; }
  .zl.r { background:rgba(255,107,61,.10); } .zl.s { background:rgba(38,166,154,.10); } .zl.in { background:rgba(240,162,2,.18); }
  .zl b { font-weight:700; } .zl .d { color:var(--dim); white-space:nowrap; }
  .zl.faded { opacity:.55; } .zl .zc { flex-basis:100%; font-size:11px; color:var(--dim); } .tag { font-size:10.5px; padding:0 4px; border-radius:4px; margin-left:3px; background:#2a3042; color:#c9ccd4; }
  .rr { padding:6px 8px; border-radius:6px; background:#161b28; margin-bottom:5px; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .rr b.g { color:#26a69a; } .rr b.o { color:#f0a202; } .rr b.r { color:#ef5350; }
  .gz { padding:7px 8px; border-radius:6px; background:#161b28; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .ck { display:flex; justify-content:space-between; gap:6px; padding:2px 0; } .ck .ok { color:#26a69a; } .ck .no { color:#ef5350; } .ck .mid { color:#8a90a0; }
  #sig { border:1px solid var(--line); border-radius:8px; padding:10px; background:#161b28; }
  #sigLabel { font-size:24px; font-weight:800; margin:2px 0; }
  .lights { display:grid; grid-template-columns:repeat(6, 1fr); gap:2px; margin:8px 0 6px; text-align:center; font-size:10.5px; }
  .lights i { display:block; width:14px; height:14px; border-radius:50%; margin:0 auto 2px; }
  @media (max-width: 760px) { body { height:auto; } .chip { white-space:normal; } main { flex-direction:column; height:auto; } #chartWrap { flex:none; height:65vh; } aside { width:100%; } }
</style>

<body>
<header>
  <select id="sym"><option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option></select>
  <select id="mkt"><option value="spot" selected>현물 (봇)</option><option value="perp">선물 (무기한)</option></select>
  <label>봉 <select id="iv">
    <option value="1m">1분</option><option value="5m">5분</option><option value="15m">15분</option><option value="1h">1시간</option>
    <option value="4h">4시간</option><option value="1d" selected>1일</option><option value="1w">1주</option></select></label>
  <label>매물대 범위 <select id="pr"><option value="all" selected>전체 역사</option><option value="730">최근 2년</option>
    <option value="365">최근 1년</option><option value="180">최근 6개월</option><option value="90">최근 3개월</option><option value="visible">보이는 구간</option></select></label>
  <label>시간 가중 <select id="hl"><option value="0">없음</option><option value="365" selected>반감기 1년</option>
    <option value="180">반감기 6개월</option><option value="90">반감기 3개월</option></select></label>
  <label>막대 세밀도 <select id="bins"><option value="auto" selected>자동</option><option value="40">굵게</option>
    <option value="80">보통</option><option value="140">세밀</option></select></label>
  <label>가격축 <select id="scale"><option value="0" selected>일반</option><option value="1">로그</option></select></label>
  <span class="dim"><span id="dot"></span><span id="upd">연결 중…</span></span>
  <button id="fitBtn" title="세로 범위를 캔들에 다시 맞춤">맞춤</button>
  <button id="detailBtn">체크 ▸</button>
  <div id="price">-</div>
</header>
<div id="status"></div>
<main>
  <div id="chartWrap"><div id="chart"></div><canvas id="overlay"></canvas><div id="ohlc"></div>
    <div id="tools">
      <button data-tool="" class="on" title="이동 (Esc)">✥</button>
      <button data-tool="h" title="수평선: 한 번 클릭">─</button>
      <button data-tool="line" title="추세선: 시작점 클릭 → 끝점 클릭">╱</button>
      <button data-tool="rect" title="박스: 한쪽 모서리 클릭 → 반대쪽 모서리 클릭">▭</button>
      <button data-tool="fib" title="피보나치 되돌림: 시작점 클릭 → 끝점 클릭">Fib</button>

    </div></div>
  <aside>
    <div class="ck-title">선물 체크 <span class="dim">· 오전 9시 종가 기준</span></div>
    <div class="card"><div class="ck-h">① 방향</div><div id="ckDir"></div></div>
    <div class="card"><div class="ck-h">② 손절 · 포지션 크기</div>
      <div class="inrow">보기 <select id="viewDir"><option value="">신호 방향대로</option><option value="1">롱으로 미리보기</option><option value="-1">숏으로 미리보기</option></select></div>
      <div class="inrow">진입가 <input id="entry" type="number" min="0" step="any" placeholder="지금 가격" style="width:86px"> <button id="entryNow" type="button">지금 가격으로</button></div>
      <div class="dimrow" style="margin-top:0">비워두면 지금 가격으로 계산 · 들어간 뒤 체결가를 넣으면 손절·익절 가격이 고정돼요</div>
      <div id="ckPlan"></div>
      <div class="inrow" style="margin-top:8px">기준 지갑 <input id="acct" type="number" min="1" step="any"> USDT · 주문 금액은 항상 지갑의 10%</div></div>
    <div class="card"><div class="ck-h">③ 3단 익절 · 10%는 추세 끝까지</div>
      <div id="ckManage"></div></div>
    <div class="card"><div class="ck-h">④ 보유 비용 (펀딩)</div><div id="ckCost"></div></div>
    <div class="card"><div class="ck-h">⑤ 매물대 위치</div><div id="ckZone"></div></div>
    <div class="dim" style="font-size:11px">선물 시스템은 백테스트상 아직 증명 안 된 가설이라 소액·데모로 확인 중. 투자 조언 아님.</div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const TZ = -new Date().getTimezoneOffset() * 60;           // show candle times in local time (KST)
const RANK = ["①", "②", "③", "④", "⑤"];
let chart, series, data = [], hist = [], ws = null, loadingOld = false, hasMore = true, livePrice = null, prof = null, profKey = null, dirty = true;

// Per market: its own prices/volume, confirmation-line buffers and breakout stats (BTC history of that market).
// Buffers = nearest distance whose close signal held at least 3 times in 4 (no close back across the zone within 10 days, 2021-2026).
// Stats = first passage within 30 days between that market's 돌파 and 거절 lines.
const MKT = {
  spot: { name: "현물", api: "https://data-api.binance.vision/api/v3/klines", ws: "wss://data-stream.binance.vision/ws/",
    brk: .05, rej: .03, brkDn: .03, hold: .05,
    st: { n: 128, from: 2019, base: 35, on: 43, off: 30, fast: 60, slow: 29, surge: 52, low: 30, cut: .08, thin: 39, thick: 31 } },
  perp: { name: "선물", api: "https://fapi.binance.com/fapi/v1/klines", ws: "wss://fstream.binance.com/market/ws/",
    brk: .05, rej: .02, brkDn: .03, hold: .05,
    st: { n: 94, from: 2021, base: 23, on: 36, off: 19, fast: 29, slow: 22, surge: 30, low: 14, cut: .09, thin: 32, thick: 15 } },
};
const M = () => MKT[$("mkt").value];
try { const m = localStorage.getItem("mkt"); if (MKT[m]) $("mkt").value = m; } catch {}
const api = () => M().api;
// USDⓈ-M market streams live under /market/ws/ (the old /ws/ path connects but sends nothing)
const wsUrl = () => M().ws
                    + $("sym").value.toLowerCase() + "@kline_" + $("iv").value;
// q = traded USDT, tb = the part bought at market (taker buy); the rest was sold at market
const toBar = k => ({ time: k[0] / 1000 + TZ, open: +k[1], high: +k[2], low: +k[3], close: +k[4], q: +k[7], tb: +k[10] });
const fmt = v => v.toLocaleString("en-US", { maximumFractionDigits: v < 1000 ? 2 : 0 });
const pct = (a, b) => (a / b - 1) * 100;
const sgn = v => (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
const nowPrice = () => livePrice ?? (data.length ? data[data.length - 1].close : null);

async function klines(interval, endTime) {
  const p = new URLSearchParams({ symbol: $("sym").value, interval, limit: 1000 });
  if (endTime) p.set("endTime", endTime);
  const r = await fetch(api() + "?" + p);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return (await r.json()).map(toBar);
}

// ---- bot rule (identical to bot.target_weight): 6 trend votes on completed daily closes + 40% vol target ----
const SPEEDS = [7, 14, 28, 56, 112, 224], LIGHT = ["1주", "2주", "4주", "8주", "16주", "32주"];
let dailyCloses = [], lastDay = null, btcCloses = [];
const todayUTC = () => Math.floor(Date.now() / 864e5) * 864e5;

function ruleAt(c) {                                   // last element = the close the decision is made on
  const n = c.length, last = c[n - 1];
  const lights = SPEEDS.map((k, i) => ({ lab: LIGHT[i], ref: c[n - 1 - k], up: last > c[n - 1 - k], chg: last / c[n - 1 - k] - 1 }));
  const votes = lights.filter(l => l.up).length, lr = [];
  for (let i = n - 20; i < n; i++) lr.push(Math.log(c[i] / c[i - 1]));
  const m = lr.reduce((s, v) => s + v, 0) / lr.length;
  const vol = Math.sqrt(lr.reduce((s, v) => s + (v - m) ** 2, 0) / (lr.length - 1) * 365);
  const w = votes >= 4 && vol > 0 ? Math.min(1, .4 / vol) : 0;
  return { lights, votes, vol, weight: Math.round(w / .1) / 10 };
}

// full daily history: drives the bot signal and the "whole history / 1-2 year" volume profile on any chart interval
async function loadDaily(full) {
  let bars = await klines("1d");
  if (full) {
    for (;;) {
      const older = await klines("1d", (bars[0].time - TZ) * 1000 - 1), fresh = older.filter(b => b.time < bars[0].time);
      if (!fresh.length) break;
      bars = fresh.concat(bars);
      if (older.length < 1000) break;
    }
    hist = bars;
  } else {
    const m = new Map(hist.map(b => [b.time, b])); bars.forEach(b => m.set(b.time, b));
    hist = [...m.values()].sort((a, b) => a.time - b.time);
  }
  const t0 = todayUTC() / 1000, done = hist.filter(b => b.time - TZ < t0);
  dailyCloses = done.map(b => b.close); lastDay = new Date((done[done.length - 1].time - TZ) * 1000);
  if ($("sym").value === "BTCUSDT") btcCloses = dailyCloses;
  else {
    const r = await fetch(api() + "?" + new URLSearchParams({ symbol: "BTCUSDT", interval: "1d", limit: 300 }));
    btcCloses = (await r.json()).map(toBar).filter(b => b.time - TZ < t0).map(b => b.close);
  }
  profKey = null; dirty = true;
}

// futures system = wf_fut.py's current pick (2026-07 quarter; re-pick quarterly): long if coin >= 5/6 and BTC >= 4/6,
// short if coin <= 1/6 and BTC <= 2/6
const FUT = { long: 5, short: 1, btcLong: 4, btcShort: 2 };

// zone confirmations decided by the last completed daily close (one-day check: touched and closed past the line)
function closeEvents() {
  const done = hist.filter(b => b.time - TZ < todayUTC() / 1000), b = done[done.length - 1], a = done[done.length - 2], m = M(), out = [];
  if (!b || !a || !prof) return out;
  for (const z of prof.zones) {
    const brk = z.hi * (1 + m.brk), rej = z.lo * (1 - m.rej), dn = z.lo * (1 - m.brkDn), hold = z.hi * (1 + m.hold);
    if (a.close < z.lo && b.high >= z.lo && b.close < rej) out.push(["거절 확정", "#ef5350", z]);
    if (a.close <= z.hi && b.close > brk) out.push(["돌파 확정", "#26a69a", z]);      // was in/below the zone
    if (a.close >= z.lo && b.close < dn) out.push(["이탈 확정", "#ef5350", z]);       // was in/above the zone (support)
    if (a.close > z.hi && b.low <= z.hi && b.close > hold) out.push(["지지 확인", "#26a69a", z]);
  }
  return out;
}

// ---- drawing tools: horizontal line, trend line, box, fib retracement. Anchored to time + price, so they follow the chart on
// every interval; kept per market + symbol in this browser (localStorage). Click to place (two clicks for line/box/fib).
const DCOL = "#4fc3f7", FIB = [0, .236, .382, .5, .618, .786, 1];
let tool = "", shapes = [], pending = null, mouse = null;
const drawKey = () => `draw_${$("mkt").value}_${$("sym").value}`;
const loadShapes = () => { try { shapes = JSON.parse(localStorage.getItem(drawKey()) || "[]"); } catch { shapes = []; } pending = null; };
const saveShapes = () => { try { localStorage.setItem(drawKey(), JSON.stringify(shapes)); } catch {} };
const barSec = () => data.length > 1 ? data[data.length - 1].time - data[data.length - 2].time : 86400;
function xToTime(x) {
  const l = chart.timeScale().coordinateToLogical(x), n = data.length;
  if (l === null || !n) return null;
  const i = Math.floor(l);
  if (i < 0) return data[0].time + l * barSec();
  if (i >= n - 1) return data[n - 1].time + (l - (n - 1)) * barSec();
  return data[i].time + (l - i) * (data[i + 1].time - data[i].time);
}
function timeToX(t) {
  const n = data.length; let l;
  if (t <= data[0].time) l = (t - data[0].time) / barSec();
  else if (t >= data[n - 1].time) l = n - 1 + (t - data[n - 1].time) / barSec();
  else { let a = 0, b = n - 1; while (b - a > 1) { const m = (a + b) >> 1; if (data[m].time <= t) a = m; else b = m; }
    l = a + (t - data[a].time) / (data[b].time - data[a].time); }
  return chart.timeScale().logicalToCoordinate(l);
}
function shapeGeom(s) {                                  // pixel geometry, or null when it cannot be placed yet
  const y1 = series.priceToCoordinate(s.p1);
  if (s.type === "h") return y1 === null ? null : { y1 };
  const x1 = timeToX(s.t1), x2 = timeToX(s.t2), y2 = series.priceToCoordinate(s.p2);
  return [x1, x2, y1, y2].some(v => v === null) ? null : { x1, x2, y1, y2 };
}
function drawShapes(g, y, paneW, H) {
  const list = shapes.slice();
  if (mouse && pending) list.push({ ...pending, t2: mouse.t, p2: mouse.p, preview: true });
  else if (mouse && tool === "h") list.push({ type: "h", p1: mouse.p, preview: true });
  if (!list.length) return;
  g.save(); g.beginPath(); g.rect(0, 0, paneW, H - 28); g.clip();
  g.font = "11px -apple-system, sans-serif"; g.lineWidth = 1.4;
  for (const s of list) {
    const q = shapeGeom(s); if (!q) continue;
    g.strokeStyle = g.fillStyle = DCOL; g.setLineDash(s.preview ? [4, 3] : []);
    const seg = (a, b, c, d) => { g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); };
    if (s.type === "h") { seg(0, q.y1, paneW, q.y1); g.fillText(fmt(s.p1), 52, q.y1 - 4); }
    else if (s.type === "line") seg(q.x1, q.y1, q.x2, q.y2);
    else if (s.type === "rect") {
      const x = Math.min(q.x1, q.x2), yy = Math.min(q.y1, q.y2), w = Math.abs(q.x2 - q.x1), h = Math.abs(q.y2 - q.y1);
      g.fillStyle = "rgba(79,195,247,.12)"; g.fillRect(x, yy, w, h); g.strokeRect(x, yy, w, h);
    } else if (s.type === "fib") {
      const x = Math.min(q.x1, q.x2);
      g.setLineDash([2, 3]); seg(q.x1, q.y1, q.x2, q.y2); g.setLineDash(s.preview ? [4, 3] : []);
      for (const f of FIB) { const p = s.p2 + (s.p1 - s.p2) * f, yy = y(p); if (yy === null) continue;
        g.globalAlpha = f === 0 || f === 1 ? 1 : .75; seg(x, yy, paneW, yy); g.fillText(`${f} (${fmt(p)})`, x + 4, yy - 3); }
      g.globalAlpha = 1;
    }
  }
  g.setLineDash([]); g.restore();
}
function hitShape(x, yy) {                                 // index of the top-most drawing under the point, or -1
  const dSeg = (a, b, c, d) => { const L = (c - a) ** 2 + (d - b) ** 2, t = L ? Math.max(0, Math.min(1, ((x - a) * (c - a) + (yy - b) * (d - b)) / L)) : 0;
    return Math.hypot(x - (a + t * (c - a)), yy - (b + t * (d - b))); };
  for (let i = shapes.length - 1; i >= 0; i--) {

  // equal-percentage (log) bins: with equal-dollar bins a $20k-era day piles into 1-2 bins while a $100k-era day
  // spreads over 7-8, which fakes heavy "zones" at old low prices on multi-year ranges
  const lo = Math.min(...bars.map(b => b.low)), hi = Math.max(...bars.map(b => b.high));
  const ls = Math.log(hi / lo) / nb || 1e-9, vol = new Array(nb).fill(0), raw = new Array(nb).fill(0), rawAge = new Array(nb).fill(0), dl = new Array(nb).fill(0);
  const edges = Array.from({ length: nb + 1 }, (_, i) => lo * Math.exp(i * ls));
  const bin = p => Math.min(nb - 1, Math.max(0, Math.floor(Math.log(p / lo) / ls)));
  const nowT = Date.now() / 1000 + TZ;
  for (const b of bars) {
    const a = bin(b.low), z = bin(b.high), age = (nowT - b.time) / 86400, share = b.q / (z - a + 1);
    const w = hl ? Math.pow(.5, age / hl) : 1;          // time decay: old volume has had time to be sold off
    const sd = (2 * b.tb - b.q) / (z - a + 1) * w;     // market buys minus market sells, spread like the volume
    for (let i = a; i <= z; i++) { vol[i] += share * w; raw[i] += share * w; rawAge[i] += share * w * age; dl[i] += sd; }   // age under the chosen weighting
  }
  const tot = vol.reduce((s, v) => s + v, 0), base = dl.reduce((s, v) => s + v, 0) / tot;
  let poc = vol.indexOf(Math.max(...vol)), L = poc, H = poc, acc = vol[poc];
  while (acc < .7 * tot) {                               // value area: grow toward the heavier neighbour
    const left = L > 0 ? vol[L - 1] : -1, right = H < nb - 1 ? vol[H + 1] : -1;
    if (left >= right) acc += vol[--L]; else acc += vol[++H];
  }
  // threshold among bins that actually traded: with time decay, near-empty old-price bins would otherwise drag the
  // 80th percentile down and merge the whole recent range into one giant "zone"
  const vmax = Math.max(...vol), active = vol.filter(v => v >= .05 * vmax).sort((x, y) => x - y);
  const cut = active[Math.floor(active.length * .8)];
  const zones = []; let i = 0;
  while (i < nb) {
    if (vol[i] >= cut) {
      let j = i, s = 0; while (j + 1 < nb && vol[j + 1] >= cut) j++;
      for (let k = i; k <= j; k++) s += vol[k];
      let r = 0, ra = 0, d = 0; for (let k = i; k <= j; k++) { r += raw[k]; ra += rawAge[k]; d += dl[k]; }
      // buy/sell lean vs this coin's own average (deltazone.py: tilts the odds ~5-10pp, never decides the direction)
      const lean = d / s - base;
      zones.push({ lo: edges[i], hi: edges[j + 1], share: s / tot, age: ra / r, lean: lean > .001 ? 1 : lean < -.001 ? -1 : 0 }); i = j + 1;
    } else i++;

  const recent = hist.filter(b => b.time >= nowT - 180 * 86400);
  for (const z of zones) {
    z.revisits = recent.filter(b => b.low <= z.hi && b.high >= z.lo).length;
    z.status = z.age <= 180 ? "최근 형성" : z.revisits >= 10 ? "소화됨" : "미소화";
  }
  [...zones].sort((a, b) => b.share - a.share).forEach((z, r) => z.rank = r);   // strongest = most traded
  return { edges, vol, zones, poc: Math.sqrt(edges[poc] * edges[poc + 1]), val: edges[L], vah: edges[H + 1] };
}

new URLSearchParams(location.search).forEach((v, k) => { if (VIEW.includes(k) && [...$(k).options].some(o => o.value === v)) $(k).value = v; });
const saveView = () => history.replaceState(null, "", "?" + new URLSearchParams(VIEW.map(k => [k, $(k).value])));
VIEW.forEach(k => $(k).addEventListener("change", saveView));
saveView();
start();
</script>

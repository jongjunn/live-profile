<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC 지지·저항</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#ffffff; --text:#131722; --dim:#787b86; --line:#e0e3eb; --soft:#f0f3fa; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
    font:14px -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, "Apple SD Gothic Neo", sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:6px 12px; border-bottom:1px solid var(--line); }
  #tfs { display:flex; flex-wrap:wrap; gap:2px; }
  #tfs button { background:none; border:0; border-radius:4px; padding:6px 8px; font:inherit; color:var(--dim); cursor:pointer; }
  #tfs button:hover { background:var(--soft); color:var(--text); }
  #tfs button.on { background:var(--soft); color:var(--text); font-weight:600; }
  #tfs .sep { width:1px; height:18px; margin:auto 4px; background:var(--line); }
  #price { font-weight:600; font-variant-numeric:tabular-nums; }
  #st { color:var(--dim); font-size:12px; }
  #dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#F23645; margin-right:5px; }
  #wrap { position:relative; flex:1; min-height:0; }
  #chart { position:absolute; inset:0; }
  #legend { position:absolute; z-index:3; top:8px; left:10px; right:110px; display:flex; flex-wrap:wrap; gap:4px; pointer-events:none; }
  #legend button { pointer-events:auto; display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border:1px solid var(--line); border-radius:4px;
    background:rgba(255,255,255,.92); color:var(--text); font:12px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; cursor:pointer; }
  #legend button::before { content:""; width:16px; height:3px; border-radius:2px; background:var(--c); }
  #legend button:hover { border-color:#b2b5be; }
  #legend button[aria-pressed="false"] { color:var(--dim); text-decoration:line-through; }
  #legend button[aria-pressed="false"]::before { background:var(--line); }
  #energy { display:flex; flex-wrap:wrap; align-items:center; gap:4px 16px; padding:6px 12px; border-top:1px solid var(--line); font-size:12px; color:var(--dim); }
  #energy span { display:inline-flex; align-items:center; gap:5px; }
  #energy b { color:var(--text); font-weight:600; }
  #energy i { width:8px; height:8px; border-radius:50%; }
  #energy .key { margin-left:auto; }
  #energy .key i { border-radius:1px; width:10px; }
</style>

<body>
<header>
  <b>BTCUSDT 무기한</b>
  <div id="tfs"></div>
  <span id="price">-</span>
  <span id="st"><span id="dot"></span><span id="upd">불러오는 중…</span></span>
</header>
<div id="wrap"><div id="chart"></div><div id="legend" title="지지·저항 선 켜고 끄기 (봉마다 현재가 위·아래로 가까운 3개씩)"></div></div>
<div id="energy" title="최근 끝난 15분봉 4개(60분) 기준. 문턱 숫자는 검증 전 고정값이다."><span><b>에너지</b> 불러오는 중…</span></div>

<script id="sr">
// 봉별 지지·저항. btc_levels.py 와 같은 규칙이고, 같은 값을 내는지 check_sr_js.py 로 확인한다.
const SR = (() => {
  //            N, 왼쪽엄격, 오른쪽엄격, 동시허용, 폭 ATR배, 폭 하한(가격비), 돌파 ATR배, 돌파 하한, 만료봉, 폭 상한(가격비. 이때 돌파 여유는 2%까지)
  const TF = { "1년": [1, 1, 1, 1, .25, 0, .10, 0, 0, .05], "6개월": [1, 1, 1, 1, .25, 0, .10, 0, 0, .05],
    "3개월": [1, 1, 1, 1, .25, 0, .10, 0, 0, .05], "1개월": [2, 1, 1, 1, .25, 0, .10, 0, 0, .05],
    "4시간": [3, 1, 0, 0, .25, .001, .10, .0005, 360, 0], "1시간": [2, 1, 1, 1, .25, 0, .10, 0, 336, 0] };
  const KEY = { "3개월": d => d.getUTCFullYear() * 10 + Math.floor(d.getUTCMonth() / 3),
    "6개월": d => d.getUTCFullYear() * 10 + Math.floor(d.getUTCMonth() / 6), "1년": d => d.getUTCFullYear() };
  const SHOW = 3;                                              // 현재가 위·아래로 가까운 구간 3개씩

  // 월봉을 분기·반기·연으로 묶는다 (마지막 묶음은 진행 중)
  function group(mo, key) {
    const out = [];
    for (const x of mo) {
      const k = key(new Date(x.t)), g = out[out.length - 1];
      if (g && g.k === k) { g.h = Math.max(g.h, x.h); g.l = Math.min(g.l, x.l); g.c = x.c; g.v += x.v || 0; g.tb += x.tb || 0; g.q += x.q || 0; g.tq += x.tq || 0; }
      else out.push({ k, t: x.t, o: x.o, h: x.h, l: x.l, c: x.c, v: x.v || 0, tb: x.tb || 0, q: x.q || 0, tq: x.tq || 0 });   // 거래량·시장가 매수 (BTC v·tb, USDT q·tq)
    }
    return out;
  }

  // Wilder ATR14 (봉 20개 이상), 아니면 그때까지 실제 범위의 평균
  function atr(b) {
    const n = b.length, A = new Array(n).fill(NaN);
    let s = 0;
    for (let i = 0; i < n; i++) {
      const x = b[i], tr = i ? Math.max(x.h - x.l, Math.abs(x.h - b[i - 1].c), Math.abs(x.l - b[i - 1].c)) : x.h - x.l;
      if (n < 20) { s += tr; A[i] = s / (i + 1); }
      else if (i < 14) { s += tr; if (i === 13) A[i] = s / 14; }
      else A[i] = (A[i - 1] * 13 + tr) / 14;
    }
    return A;
  }

  // 좌우 N봉 스윙 피벗 → [봉 번호, 역할(-1 고점=저항, +1 저점=지지)], 고점 먼저
  function pivots(b, N, ls, rs, both) {
    const H = [], L = [];
    for (let i = N; i < b.length - N; i++) {
      let hi = true, lo = true;
      for (let k = 1; k <= N; k++) {
        hi = hi && (ls ? b[i].h > b[i - k].h : b[i].h >= b[i - k].h) && (rs ? b[i].h > b[i + k].h : b[i].h >= b[i + k].h);
        lo = lo && (ls ? b[i].l < b[i - k].l : b[i].l <= b[i - k].l) && (rs ? b[i].l < b[i + k].l : b[i].l <= b[i + k].l);
      }
      if (!both && hi && lo) hi = lo = false;
      if (hi) H.push([i, -1]);
      if (lo) L.push([i, 1]);
    }
    return H.concat(L);
  }

  // 완료 봉 b에서 시간 순서대로 구간을 만들고 갱신 → 살아 있는 구간 (1개월 이상은 직전 봉 고가·저가도)
  // 구간 = 피벗 ± 폭, 종가 2개 연속 밖이면 첫 번째는 역할 전환, 두 번째는 무효. 1시간 336봉·4시간 360봉 지나면 만료
  function zones(b, tf) {
    const [N, ls, rs, both, KW, PW, KB, PB, life, cap] = TF[tf], A = atr(b), n = b.length, born = {}, Z = [];
    for (const [i, r] of pivots(b, N, ls, rs, both)) (born[i + N] ??= []).push([i, r]);
    for (let t = 0; t < n; t++) {
      const c = b[t].c;
      for (const z of Z) {
        if (!z.alive || t <= z.conf) continue;
        if (life && t - z.s > life) { z.alive = false; continue; }
        z.run = (z.role < 0 ? c > z.U + z.m : c < z.D - z.m) ? z.run + 1 : 0;
        if (z.run >= 2) {
          if (z.flips) z.alive = false;
          else { z.role = -z.role; z.flips = 1; z.run = 0; }
        }
      }
      for (const [s, r] of born[t] || []) {
        const p = r > 0 ? b[s].l : b[s].h;
        if (!Number.isFinite(A[t])) continue;
        let w = Math.max(KW * A[t], PW * p), m = KB * A[t] + PB * p;
        if (cap) { w = Math.min(w, cap * p); m = Math.min(m, .02 * p); }
        let near = null;                                       // 가까운 피벗은 기존 구간에 합친다 (접촉 수만 +1)
        for (const z of Z) {
          const d = Math.abs(p - z.P);
          if (z.alive && d <= Math.min(w, z.w) && (!near || d < Math.abs(p - near.P) || (d === Math.abs(p - near.P) && z.s < near.s))) near = z;
        }
        if (near) { near.touch++; continue; }
        Z.push({ P: p, w, D: p - w, U: p + w, m, role: r, s, conf: t, run: 0, flips: 0, alive: true, touch: 1 });
      }
    }
    const out = Z.filter(z => z.alive);
    if (!life && n) {
      const x = b[n - 1];
      for (const [p, r] of [[x.h, -1], [x.l, 1]]) {
        const w = Math.min(KW * A[n - 1], cap * p);
        if (!out.some(z => Math.abs(p - z.P) <= Math.min(w, z.w))) out.push({ P: p, w, D: p - w, U: p + w, role: r, touch: 1 });
      }
    }
    return out;
  }

  // 같은 쪽에서 겹치는 구간은 한 띠로 합친다
  function union(zs) {
    const out = [];
    for (const z of [...zs].sort((a, b) => a.D - b.D)) {
      const g = out[out.length - 1];
      if (g && z.D <= g.U) { g.D = Math.min(g.D, z.D); g.U = Math.max(g.U, z.U); g.P = (g.D + g.U) / 2; g.parts.push(z); }
      else out.push({ ...z, parts: [z] });
    }
    return out;
  }

  function pick(Z, px) {
    return { sup: union(Z.filter(z => z.U < px)).sort((a, b) => (px - a.P) - (px - b.P)).slice(0, SHOW),
      res: union(Z.filter(z => z.D > px)).sort((a, b) => (a.P - px) - (b.P - px)).slice(0, SHOW),
      inside: union(Z.filter(z => z.D <= px && px <= z.U)) };
  }

  // 입력: 월봉·4시간·1시간 (각각 마지막이 진행 중 봉) → 봉별 살아 있는 구간
  function compute(mo, h4, h1) {
    const all = { "1년": group(mo, KEY["1년"]), "6개월": group(mo, KEY["6개월"]), "3개월": group(mo, KEY["3개월"]), "1개월": mo, "4시간": h4, "1시간": h1 };
    return Object.fromEntries(Object.entries(all).map(([tf, b]) => [tf, zones(b.slice(0, -1), tf)]));
  }

  return { KEY, group, compute, pick, atr };
})();
</script>

<script>
const $ = id => document.getElementById(id);
const ORDER = ["1년", "6개월", "3개월", "1개월", "4시간", "1시간"];             // 지지·저항을 계산하는 봉
const VIEW = [...ORDER, "30분", "15분", "5분", "1분"];                         // 차트로 볼 수 있는 봉 (분봉은 보기만)
// 선 색: 긴 봉은 어둡고 차가운 색, 짧은 봉은 따뜻한 색. 캔들 초록·빨강을 피했고 흰 바탕 대비 3:1 이상, 색끼리 일반 시력 색차(OKLab×100) 17 이상
const SHADE = { "1년": "#000000", "6개월": "#1e3a8a", "3개월": "#8e24aa", "1개월": "#2a78d6", "4시간": "#8d5524", "1시간": "#c98500" };
const IV = { "1년": "1M", "6개월": "1M", "3개월": "1M", "1개월": "1M", "4시간": "4h", "1시간": "1h", "30분": "30m", "15분": "15m", "5분": "5m", "1분": "1m" };
const API = "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&limit=1500&interval=";
const WS = "wss://fstream.binance.com/market/ws/btcusdt@kline_";   // USDⓈ-M 스트림은 /market/ws/ 아래 (옛 /ws/는 연결만 되고 안 옴)
const UP = "#089981", DN = "#F23645", TZ = -new Date().getTimezoneOffset() * 60;   // 봉 시간을 내 시간(KST)으로
const two = n => String(n).padStart(2, "0");
let tf = "4시간", D = null, Z = null, px = null, ws = null, lines = [], drawn = null, hide = new Set();
try { if (VIEW.includes(localStorage.srTf)) tf = localStorage.srTf; hide = new Set(JSON.parse(localStorage.srHide || "[]")); } catch {}

const chart = LightweightCharts.createChart($("chart"), {
  autoSize: true,
  layout: { background: { color: "#ffffff" }, textColor: "#131722", fontSize: 12,
    fontFamily: '-apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, "Apple SD Gothic Neo", sans-serif' },
  grid: { vertLines: { color: "#f0f3fa" }, horzLines: { color: "#f0f3fa" } },
  rightPriceScale: { borderVisible: false, scaleMargins: { top: .08, bottom: .08 } },
  timeScale: { borderVisible: false, rightOffset: 8 },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  localization: { locale: "ko-KR", timeFormatter: t => {
    const d = new Date(t * 1000), s = `${d.getUTCFullYear()}-${two(d.getUTCMonth() + 1)}`;
    return IV[tf] === "1M" ? s : `${s}-${two(d.getUTCDate())} ${two(d.getUTCHours())}:${two(d.getUTCMinutes())}`; } },
});
const series = chart.addSeries(LightweightCharts.CandlestickSeries, { upColor: UP, downColor: DN, borderVisible: false,
  wickUpColor: UP, wickDownColor: DN, priceFormat: { type: "custom", formatter: v => Math.round(v).toLocaleString("en-US"), minMove: 1 } });

const toBar = k => ({ t: +k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5], tb: +k[9], q: +k[7], tq: +k[10] });   // 시장가 매수: k[9] BTC, k[10] USDT
const toCandle = b => ({ time: b.t / 1000 + TZ, open: b.o, high: b.h, low: b.l, close: b.c });
const get = iv => fetch(API + iv + (iv === "1M" ? "&startTime=0" : ""))
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(a => a.map(toBar));
const bars = () => SR.KEY[tf] ? SR.group(D["1M"], SR.KEY[tf]) : D[IV[tf]];

// 아래 칸: 봉마다 시장가 매수 − 시장가 매도 (USDT). 0 위 초록 = 매수 에너지가 더 셈, 0 아래 빨강 = 매도 에너지가 더 셈
const cfmt = v => { const a = Math.abs(v), s = v > 0 ? "+" : v < 0 ? "−" : "";
  return s + (a >= 1e9 ? (a / 1e9).toFixed(1) + "B" : a >= 1e6 ? (a / 1e6).toFixed(1) + "M" : a >= 1e3 ? (a / 1e3).toFixed(0) + "K" : a.toFixed(0)); };
const deltaS = chart.addSeries(LightweightCharts.HistogramSeries,
  { priceFormat: { type: "custom", formatter: cfmt, minMove: 1 }, lastValueVisible: false, priceLineVisible: false }, 1);
chart.panes()[1].setStretchFactor(.4);
const eBar = x => { const d = 2 * x.tq - x.q; return { time: x.t / 1000 + TZ, value: d, color: d >= 0 ? "rgba(8,153,129,.85)" : "rgba(242,54,69,.85)" }; };
function setAll() { const b = bars(); series.setData(b.map(toCandle)); deltaS.setData(b.map(eBar)); }
function setLast() { const x = bars().at(-1); series.update(toCandle(x)); deltaS.update(eBar(x)); }

// 켜 둔 봉의 선을 그린다. 여러 봉에 같은 가격이 있으면 선 하나(가장 긴 봉 색)에 이름을 모은다.
// 짧은 봉 선부터 그려서 긴 봉 선이 위에 온다
function draw() {
  if (!Z || px == null) return;
  const at = new Map();
  for (const t of ORDER) {
    if (hide.has(t)) continue;
    const p = SR.pick(Z[t], px);
    for (const z of [...p.res, ...p.inside, ...p.sup]) { const k = Math.round(z.P); at.set(k, [...new Set([...(at.get(k) || []), t])]); }
  }
  const sel = [...at].sort((a, b) => ORDER.indexOf(b[1][0]) - ORDER.indexOf(a[1][0]));
  const key = sel.join();
  if (key === drawn) return;
  drawn = key;
  lines.forEach(l => series.removePriceLine(l));
  lines = sel.map(([p, ts]) => series.createPriceLine({ price: p, color: SHADE[ts[0]], lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Solid,
    axisLabelVisible: true, title: ts.join("·"), axisLabelColor: SHADE[ts[0]], axisLabelTextColor: ts[0] === "1시간" ? "#131722" : "#ffffff" }));
}

function setPrice(p) {
  $("price").style.color = px == null || p >= px ? UP : DN;
  px = p;
  $("price").textContent = p.toLocaleString("en-US", { maximumFractionDigits: 0 });
  draw();
}

function connect() {
  if (ws) { ws.onclose = ws.onmessage = null; ws.close(); }
  ws = new WebSocket(WS + IV[tf]);
  ws.onopen = () => $("dot").style.background = UP;
  ws.onclose = () => { $("dot").style.background = DN; setTimeout(connect, 3000); };
  ws.onmessage = e => {
    const k = JSON.parse(e.data).k, a = k && D && D[k.i];
    if (!a) return;
    const b = { t: k.t, o: +k.o, h: +k.h, l: +k.l, c: +k.c, v: +k.v, tb: +k.V, q: +k.q, tq: +k.Q };
    if (b.t === a.at(-1).t) a[a.length - 1] = b; else if (b.t > a.at(-1).t) a.push(b);
    if (k.i === IV[tf]) setLast();
    setPrice(b.c);
    $("upd").textContent = "실시간 " + new Date().toLocaleTimeString("ko-KR");
  };
}

// 긴 봉은 전체, 나머지는 최근 200봉. 탭이 가려진 채 열리면 차트 폭이 0이라 틀어지므로 폭이 생길 때 다시 맞춘다
let reframe = false;
function frame() {
  reframe = !chart.timeScale().width();
  const n = series.data().length;                              // fitContent 는 오른쪽 여백만큼 왼쪽 봉을 잘라서 직접 범위를 준다
  chart.timeScale().setVisibleLogicalRange(IV[tf] === "1M" ? { from: -1, to: n + 2 } : { from: n - 200, to: n + 8 });
}
chart.timeScale().subscribeSizeChange(() => { if (reframe) frame(); });

async function show() {
  const want = tf, iv = IV[tf];
  document.querySelectorAll("#tfs button").forEach(b => b.classList.toggle("on", b.textContent === tf));
  if (/m$/.test(iv)) {                                         // 분봉은 고를 때마다 새로 받는다 (차트로만 보고 선 계산엔 안 씀)
    try { D[iv] = await get(iv); } catch (e) { $("upd").textContent = "데이터 오류: " + e.message; return; }
    if (want !== tf) return;                                   // 받는 사이 다른 봉을 골랐으면 버린다
  }
  chart.applyOptions({ timeScale: { timeVisible: iv !== "1M" } });
  setAll();
  frame();
  connect();
}

// 시세를 새로 받아 봉별 구간을 다시 계산. 1시간·4시간·월봉은 모두 정시에 닫히므로 매 정시 5초 뒤에 다시
async function refresh() {
  let wait = 3600e3 - Date.now() % 3600e3 + 5e3;
  try {
    const [mo, h4, h1] = await Promise.all([get("1M"), get("4h"), get("1h")]);
    const first = !D;
    D = Object.assign(D || {}, { "1M": mo, "4h": h4, "1h": h1 }); Z = SR.compute(mo, h4, h1); drawn = null;
    if (first) await show();
    else if (!/m$/.test(IV[tf])) { const r = chart.timeScale().getVisibleLogicalRange(); setAll(); if (r) chart.timeScale().setVisibleLogicalRange(r); }
    if (px == null) setPrice(h1.at(-1).c); else draw();
    $("upd").textContent = "갱신 " + new Date().toLocaleTimeString("ko-KR");
  } catch (e) { $("upd").textContent = "데이터 오류: " + e.message + " (30초 뒤 다시)"; wait = 30e3; }
  setTimeout(refresh, wait);
}

$("tfs").innerHTML = VIEW.map(t => (t === "30분" ? '<span class="sep"></span>' : "") + `<button>${t}</button>`).join("");
$("tfs").onclick = e => {
  if (e.target.tagName !== "BUTTON" || !D) return;
  tf = e.target.textContent; try { localStorage.srTf = tf; } catch {}
  show();
};
$("legend").innerHTML = ORDER.map(t => `<button data-t="${t}" style="--c:${SHADE[t]}">${t}</button>`).join("");
const paint = () => $("legend").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(!hide.has(b.dataset.t))));
$("legend").onclick = e => {
  const t = e.target.closest("button")?.dataset.t;
  if (!t) return;
  hide.has(t) ? hide.delete(t) : hide.add(t);
  try { localStorage.srHide = JSON.stringify([...hide]); } catch {}
  paint(); drawn = null; draw();
};
paint();
refresh();

// 최근 60분(끝난 15분봉 4개) 롱·숏 에너지 판독. 문턱은 코덱스 제안 그대로인 검증 전 고정값
// (reports/지지저항 정하는 법 코덱스 딥리서치.md 6장). 15분마다 다시 계산한다
const getJ = u => fetch("https://fapi.binance.com" + u).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
const sum = a => a.reduce((s, x) => s + x, 0);
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const sgn = (x, d) => (x >= 0 ? "+" : "") + x.toFixed(d);
async function readEnergy() {
  let wait = 900e3 - Date.now() % 900e3 + 5e3;
  try {
    const [k, oi, fr] = await Promise.all([getJ("/fapi/v1/klines?symbol=BTCUSDT&interval=15m&limit=300"),
      getJ("/futures/data/openInterestHist?symbol=BTCUSDT&period=15m&limit=5").catch(() => null),
      getJ("/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2").catch(() => null)]);
    const b = k.slice(0, -1).map(toBar), n = b.length, w = b.slice(n - 4);           // 끝난 봉만
    const V = sum(w.map(x => x.v)), Dv = (2 * sum(w.map(x => x.tb)) - V) / V;         // D = (매수−매도)/전체
    const R = V / median(Array.from({ length: 20 }, (_, i) => sum(b.slice(n - 8 - 4 * i, n - 4 - 4 * i).map(x => x.v))));
    const A = SR.atr(b.slice(0, n - 4)).at(-1), mv = (w[3].c - b[n - 5].c) / A;       // 구간 시작 전 15분 ATR 기준 순이동
    const side = R >= 1.5 && Dv >= .2 ? 1 : R >= 1.5 && Dv <= -.2 ? -1 : 0, who = side > 0 ? "매수" : "매도";
    let atk = ["혼합·약한 공격", "#b2b5be"], px1 = `${sgn(mv, 2)} ATR`;
    if (side && Math.abs(mv) <= .25) { atk = [`${who} 공격 우세`, side > 0 ? UP : DN]; px1 = `흡수 가능성 (${px1}, 반대편이 받아 줌)`; }
    else if (side && mv * side < 0) { atk = [`${who} 공격 많았지만 우세 보류`, "#b2b5be"]; px1 = `공격과 반대로 움직임 (${px1})`; }
    else if (side) { atk = [`${who} 공격 우세`, side > 0 ? UP : DN]; px1 = `${mv * side >= .5 ? "따라감" : "조금 따라감"} (${px1})`; }
    const g = oi && oi.length >= 5 ? +oi.at(-1).sumOpenInterest / +oi.at(-5).sumOpenInterest - 1 : null;
    const f8 = fr && fr.length === 2 ? +fr[1].fundingRate * 8 / ((fr[1].fundingTime - fr[0].fundingTime) / 36e5) : null;
    const it = (label, val, color) => `<span><i style="background:${color}"></i>${label} <b>${val}</b></span>`;
    const end = new Date(w[3].t + 900e3).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    $("energy").innerHTML = [`<span><b>에너지</b> 최근 60분 · ${end}까지</span>`,
      it("공격", `${atk[0]}`, atk[1]) + ` 매수 ${((1 + Dv) * 50).toFixed(0)}% · 거래량 ${R.toFixed(1)}배`,
      it("가격", px1, "#b2b5be"),
      g == null ? "<span>미결제약정 -</span>" : it("미결제약정", `${g >= .005 ? "확대" : g <= -.005 ? "축소" : "보합"} ${sgn(g * 100, 2)}%`, "#b2b5be"),
      f8 == null ? "<span>펀딩 -</span>" : it("펀딩", `${f8 >= .0003 ? "롱 보유 비용 높음" : f8 <= -.0003 ? "숏 보유 비용 높음" : "보통"} ${sgn(f8 * 100, 3)}%/8h`, "#b2b5be"),
      `<span class="key">아래 칸 = 시장가 매수 − 매도 <i style="background:${UP}"></i>매수가 셈 <i style="background:${DN}"></i>매도가 셈</span>`].join("");
  } catch (e) { $("energy").innerHTML = `<span><b>에너지</b> 오류: ${e.message} (1분 뒤 다시)</span>`; wait = 60e3; }
  setTimeout(readEnergy, wait);
}
readEnergy();
</script>
